name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact protected package version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'festappnet/banksync'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the minimum trusted-publishing npm CLI
        run: |
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"
      - name: Require the protected tag to equal the package version
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            test "${{ inputs.version }}" = "$PACKAGE_VERSION"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level low
      - name: Verify fresh and original-v9 D1 migration flows
        shell: bash
        run: |
          rm -rf /tmp/banksync-d1-fresh /tmp/banksync-d1-upgrade
          pnpm wrangler d1 migrations apply DB --local --persist-to /tmp/banksync-d1-fresh --config wrangler.example.toml
          sed "s#migrations_dir = \"migrations\"#migrations_dir = \"$GITHUB_WORKSPACE/test-fixtures/migrations-v9\"#" wrangler.example.toml > /tmp/banksync-v9.toml
          pnpm wrangler d1 migrations apply DB --local --persist-to /tmp/banksync-d1-upgrade --config /tmp/banksync-v9.toml
          pnpm wrangler d1 migrations apply DB --local --persist-to /tmp/banksync-d1-upgrade --config wrangler.example.toml
          pnpm wrangler d1 execute DB --local --persist-to /tmp/banksync-d1-fresh --config wrangler.example.toml --command "SELECT value FROM schema_meta WHERE key='version'" | grep -q '10'
          pnpm wrangler d1 execute DB --local --persist-to /tmp/banksync-d1-upgrade --config wrangler.example.toml --command "SELECT value FROM schema_meta WHERE key='version'" | grep -q '10'
      - run: pnpm wrangler deploy --config wrangler.example.toml --dry-run --outdir /tmp/banksync-worker-dry-run
      - name: Build the release tarball once
        id: pack
        shell: bash
        run: |
          mkdir -p release
          TARBALL=$(npm pack --ignore-scripts --pack-destination release --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].filename))")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          test "$(tar -tzf "release/$TARBALL" | grep '^package/migrations/' | sort | tr '\n' ' ')" = "package/migrations/0001_schema.sql package/migrations/0010_security_hardening.sql "
          if tar -xOf "release/$TARBALL" package/dist/index.js | grep -q 'verifyWebhookSignature'; then exit 1; fi
          sha256sum "release/$TARBALL" | tee "release/$TARBALL.sha256"
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: release/${{ steps.pack.outputs.tarball }}
          format: cyclonedx-json
          output-file: release/${{ steps.pack.outputs.tarball }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/${{ steps.pack.outputs.tarball }}
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: release/${{ steps.pack.outputs.tarball }}
          sbom-path: release/${{ steps.pack.outputs.tarball }}.sbom.cdx.json
      - name: Publish the exact tested bytes through npm trusted publishing
        run: npm publish "./release/${{ steps.pack.outputs.tarball }}" --access public --provenance --ignore-scripts
      - name: Attach the same bytes to the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
